<template class="flex min-h-0 min-w-0 flex-1 overflow-hidden">
  <import from="../../../attributes/code-selection"></import>
  <import from="../../../elements/image-preview/image-preview"></import>
  <import from="../../../attributes/splitter-bounds"></import>
  <div class="w-[280px] min-w-0 shrink-0 overflow-auto">
    <div class="px-3 py-2 text-xs text-ink-500">Files at this commit · ${fileCount}</div>
    <ui-form class="search-form block min-w-0 px-2">
      <ui-input class="col-span-12 min-w-0" label="Find a file" value.bind="fileQuery">
        <svg au-slot="leading" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="10" cy="10" r="6"></circle>
          <path d="m 15 15 5 5"></path>
        </svg>
      </ui-input>
    </ui-form>
    <div if.bind="treeLoading" class="p-4 text-sm text-ink-500">Loading files…</div>
    <ui-alert if.bind="error" tone="danger">${error}</ui-alert>
    <ui-tree if.bind="!treeLoading && !error" class="border-0! rounded-none!" items.bind="nodes" value.bind="selectedNode" value-field="path" label-field="name" label="Commit files" toggle-on-parent-click tree-select.trigger="selectFile($event.detail)">
      <template au-slot="item">
        <span class="block truncate" title.bind="$host.item.path">${$host.item.name}${$host.item.entry?.kind === 'commit' ? ' (submodule)' : ''}</span>
      </template>
    </ui-tree>
    <div if.bind="!treeLoading && !error && !fileCount" class="p-4 text-sm text-ink-500">This commit has no files.</div>
    <div if.bind="fileQuery && fileCount && !nodes.length" class="p-4 text-sm text-ink-500">No matching files.</div>
  </div>
  <ui-splitter splitter-bounds direction="horizontal" size="280" min.bind="0" max.bind="Number.MAX_SAFE_INTEGER" storage-key="${workspace.splitterStoragePrefix}:commit-files" aria-label="Resize commit file tree"></ui-splitter>
  <section class="flex min-h-0 min-w-0 flex-1 flex-col bg-canvas">
    <div class="min-h-8 shrink-0 truncate border-b border-card-border px-3 py-1 text-sm" title.bind="selectedPath">${selectedPath || 'File contents'}</div>
    <ui-form if.bind="lines.length" class="search-form block w-80 max-w-full shrink-0 px-3" submit.trigger:prevent="findInFile()">
      <ui-input class="col-span-10 min-w-0" label="Find in file" value.bind="contentQuery">
        <svg au-slot="leading" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="10" cy="10" r="6"></circle>
          <path d="m 15 15 5 5"></path>
        </svg>
        <span au-slot="trailing" class="whitespace-nowrap text-xs" role="status" if.bind="contentQuery">${contentMatches.length} matches</span>
      </ui-input>
      <button ui-icon-button class="col-span-2" type="submit" title="Next matching line" aria-label="Next matching line" disabled.bind="!contentMatches.length">↓</button>
    </ui-form>
    <div class="min-h-0 flex-1 overflow-auto">
      <div if.bind="fileLoading" class="p-8 text-center text-sm text-ink-500">Loading file…</div>
      <image-preview if.bind="!fileLoading && image" class="p-4" source.bind="image" label.bind="selectedPath"></image-preview>
      <div if.bind="!fileLoading && (!selectedPath || message)" class="p-8 text-center text-sm text-ink-500">${message || 'Select a file to view its contents at this commit.'}</div>
      <div if.bind="!fileLoading && lines.length" class="file-content min-w-max py-2 text-xs leading-[21px]" tabindex="0" aria-label="File contents" code-selection="code">
        <div repeat.for="line of lines" data-line.bind="$index" class="flex min-h-[21px] whitespace-pre ${matchLine === $index ? 'bg-warning-bg' : ''}">
          <span class="line-number w-12 shrink-0 pr-3 text-right font-mono text-ink-500 select-none">${$index + 1}</span>
          <code class="pr-4 [tab-size:4]" innerhtml.bind="line"></code>
        </div>
        <p if.bind="truncated" class="p-4 text-ink-500">Preview limited to 12,000 lines.</p>
      </div>
    </div>
  </section>
</template>
