<template class="repository-tool-dialog flex w-[780px] max-w-[90vw] max-h-[90vh] min-w-0 flex-col gap-3 overflow-hidden p-5">
  <h2 class="text-xl!">Tags</h2>
  <ui-form class="search-form block shrink-0">
    <ui-input class="col-span-12" label="Search tags" value.bind="query"><span au-slot="leading">⌕</span></ui-input>
  </ui-form>
  <div class="min-h-0 max-h-60 overflow-auto">
    <ui-list items.bind="filtered" selected.bind="selected" typeahead-field="name" aria-label="Tags">
      <ui-list-item repeat.for="tag of filtered; key: name" value.bind="tag">
        <div class="min-w-0">
          <strong>${tag.name}</strong>
          <div class="text-sm text-ink-500">${tag.target.slice(0, 10)} · ${tag.annotated ? 'Annotated' : 'Lightweight'} · ${tag.message}</div>
        </div>
      </ui-list-item>
    </ui-list>
    <p if.bind="!filtered.length">${loading ? 'Loading…' : 'No tags found.'}</p>
  </div>
  <ui-form if.bind="selected" class="block shrink-0">
    <ui-select class="col-span-4 min-w-0" label="Tag remote" items.bind="remotes" value.bind="remote" value-field="name" label-field="name">
      <ui-list><ui-list-item repeat.for="remote of $host.items; key: name" value.bind="remote">${remote.name}</ui-list-item></ui-list>
    </ui-select>
    <button ui-button class="col-span-4" click.trigger="selectedAction('tag-push')" disabled.bind="!remote || workspace.busy">Push selected tag</button>
    <button ui-button class="col-span-4" danger click.trigger="deletingRemote = true" disabled.bind="!remote || workspace.busy">Delete remote tag…</button>
    <button ui-button class="col-span-12" danger if.bind="deletingRemote" click.trigger="selectedAction('tag-delete-remote')" disabled.bind="!remote || workspace.busy">Delete ${selected.name} from ${remote}</button>
    <button ui-button class="col-span-4 col-start-9" danger click.trigger="deleting = true" disabled.bind="workspace.busy">Delete local tag…</button>
    <button ui-button class="col-span-12" danger if.bind="deleting" click.trigger="selectedAction('tag-delete')" disabled.bind="workspace.busy">Delete ${selected.name}</button>
  </ui-form>
  <ui-form class="block shrink-0 border-t border-card-border" submit.trigger:prevent="create()">
    <ui-input class="col-span-6 min-w-0" label="Tag name" value.bind="name & validate"></ui-input>
    <ui-input class="col-span-6 min-w-0" label="Tag target" value.bind="reference & validate"></ui-input>
    <ui-input class="col-span-8" label="Annotation" value.bind="message"><span au-slot="helper">Leave empty for a lightweight tag.</span></ui-input>
    <button ui-button class="col-span-4" primary type="submit" formnovalidate disabled.bind="workspace.busy || loading">Create tag</button>
  </ui-form>
  <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
  <p role="status" class="text-sm">${status}</p>
  <div class="flex justify-end gap-2">
    <button ui-button click.trigger="refresh()" disabled.bind="loading || workspace.busy">Refresh tags</button>
    <button ui-button click.trigger="close()" disabled.bind="loading || workspace.busy">Close</button>
  </div>
</template>
