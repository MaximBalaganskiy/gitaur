<import from="../../../elements/diff-view/diff-view"></import>
<template class="stash-manager flex w-[900px] max-w-full max-h-[90vh] min-w-0 flex-col gap-3 overflow-auto p-5">
  <h2 class="text-xl!">Stashes</h2>
  <ui-form class="block border-b border-card-border" submit.trigger:prevent="act('stash-save')">
    <ui-input class="col-span-9" label="Stash message (optional)" value.bind="message" disabled.bind="workspace.busy"></ui-input>
    <button ui-button class="col-span-3" type="submit" disabled.bind="workspace.busy || !workspace.snapshot.files.length || !!workspace.snapshot.operation">Save stash</button>
    <ui-checkbox class="col-span-12" checked.bind="includeUntracked" disabled.bind="workspace.busy">Include untracked files</ui-checkbox>
  </ui-form>
  <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
  <ui-form if.bind="stashes.length" class="block">
    <ui-select class="col-span-12" label="Saved stash" items.bind="stashes" value.bind="selectedHash" value-field="hash" label-field="message" disabled.bind="workspace.busy">
      <ui-list>
        <ui-list-item repeat.for="stash of $host.items" value.bind="stash">
          ${stash.message}
          <span au-slot="secondary">${stash.reference} · ${stash.date}</span>
        </ui-list-item>
      </ui-list>
    </ui-select>
  </ui-form>
  <p if.bind="!stashes.length" class="p-4 text-center text-ink-500">No saved stashes.</p>
  <div if.bind="selected" class="flex min-h-0 flex-col">
    <p class="mb-2 text-xs text-ink-500">${selected.reference} · ${selected.date}</p>
    <div class="flex h-[260px] min-h-0 border border-card-border"><diff-view text.bind="diff" is-loading.bind="loading"></diff-view></div>
    <p class="mt-2 text-xs text-ink-500">Apply keeps the stash. Pop removes it only after a successful apply. Both restore the saved staging state.</p>
  </div>
  <div if.bind="dropping" class="grid gap-2 rounded border border-danger-border p-3">
    <p>Delete “${selected.message}”? Its saved changes will no longer be listed.</p>
    <div class="flex justify-end gap-2">
      <button ui-button click.trigger="dropping = false" disabled.bind="workspace.busy">Cancel deletion</button>
      <button ui-button danger click.trigger="act('stash-drop')" disabled.bind="workspace.busy">Delete stash</button>
    </div>
  </div>
  <div class="flex flex-wrap justify-end gap-2">
    <button ui-button if.bind="workspace.snapshot.files.some(file => file.conflict)" click.trigger="resolveConflicts()">Resolve conflicts…</button>
    <button ui-button danger if.bind="selected" click.trigger="dropping = true" disabled.bind="workspace.busy">Drop…</button>
    <button ui-button if.bind="selected" click.trigger="act('stash-apply')" disabled.bind="workspace.busy">Apply</button>
    <button ui-button if.bind="selected" click.trigger="act('stash-pop')" disabled.bind="workspace.busy">Pop</button>
    <button ui-button click.trigger="close()" disabled.bind="workspace.busy">Close</button>
  </div>
</template>
