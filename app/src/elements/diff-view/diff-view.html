<template>
  <import from="../../attributes/code-selection"></import>
  <div if.bind="selectable && !isLoading && !truncated" class="sticky top-0 z-10 flex items-center gap-3 border-b border-card-border bg-card px-3 py-2">
    <span class="text-xs text-ink-500">${selected.length} changed lines selected</span>
    <button ui-button click.trigger="apply()" disabled.bind="disabled || !selected.length">${staged ? 'Unstage selected lines' : 'Stage selected lines'}</button>
    <button ui-button danger if.bind="resettable" click.trigger="apply(selected, true)" disabled.bind="disabled || !selected.length">Reset selected lines…</button>
    <button ui-button click.trigger="selected = []" disabled.bind="!selected.length">Clear selection</button>
  </div>
  <div class="diff-empty grid h-full min-h-40 place-items-center text-xs text-ink-500" if.bind="isLoading">Loading diff…</div>
  <div class="diff-empty grid h-full min-h-40 place-items-center text-xs text-ink-500" if.bind="!isLoading && !text">Select a file to inspect its changes.</div>
  <div class="diff-code min-w-max pt-2 pb-5 text-xs leading-[21px]" if.bind="!isLoading && text" tabindex="0" aria-label="File diff" code-selection=".diff-line.added .diff-content, .diff-line.removed .diff-content, .diff-line.context .diff-content">
    <div repeat.for="line of lines" class="diff-line flex min-h-[21px] whitespace-pre ${line.kind}">
      <div if.bind="selectable && !truncated" class="flex w-8 shrink-0 items-center justify-center">
        <button ui-icon-button size="small" if.bind="line.kind === 'added' || line.kind === 'removed'" aria-label="Select change at diff line ${$index + 1}" aria-pressed.bind="selected.includes($index)" disabled.bind="disabled" click.trigger="toggle($index)">${selected.includes($index) ? '✓' : '+'}</button>
      </div>
      <span class="line-number w-[43px] shrink-0 pr-2.5 text-right font-mono text-[10px] text-ink-500 opacity-70 select-none">${line.old}</span>
      <span class="line-number w-[43px] shrink-0 pr-2.5 text-right font-mono text-[10px] text-ink-500 opacity-70 select-none">${line.next}</span>
      <!-- prettier-ignore -->
      <code><span if.bind="line.kind === 'added' || line.kind === 'removed' || line.kind === 'context'" class="diff-marker select-none" aria-hidden="true">${line.text[0]}</span><span class="diff-content" innerhtml.bind="line.html"></span></code>
      <button ui-button if.bind="selectable && !truncated && line.kind === 'hunk'" class="mx-2 text-xs!" disabled.bind="disabled" click.trigger="applyHunk($index)">${staged ? 'Unstage hunk' : 'Stage hunk'}</button>
      <button ui-button danger if.bind="selectable && resettable && !truncated && line.kind === 'hunk'" class="mx-2 text-xs!" disabled.bind="disabled" click.trigger="applyHunk($index, true)">Reset hunk…</button>
    </div>
    <div if.bind="truncated" class="diff-limit p-4 text-ink-500">Preview limited to 12,000 lines.</div>
  </div>
</template>
