<template class="flex min-w-0 flex-col gap-2">
  <div class="flex min-h-9 flex-wrap items-center justify-between gap-2 text-xs text-ink-500">
    <span>${dimensions}</span>
    <button ui-button if.bind="!failed" click.trigger="actualSize = !actualSize" aria-pressed.bind="actualSize">${actualSize ? 'Fit image' : 'Actual size'}</button>
  </div>
  <p if.bind="failed" class="p-6 text-center text-sm text-ink-500" role="status">Unable to display this image. The file may be damaged or its format unsupported.</p>
  <div class="image-surface overflow-auto rounded border border-card-border ${actualSize ? 'actual-size' : ''}" tabindex="0" aria-label="${label} image preview" show.bind="!failed">
    <img src.bind="source" alt.bind="label" load.trigger="loaded($event)" error.trigger="loadFailed($event)" />
  </div>
</template>
